version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: retail-assistant-backend
    ports:
      - "8000:8000"
    environment:
      - VECTOR_DB_PATH=data/vector_db
      - CLIP_MODEL_NAME=clip-ViT-B-32
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./scripts:/app/scripts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: retail-assistant-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - ./data:/app/data
    restart: unless-stopped

volumes:
  data:
    driver: local

networks:
  default:
    name: retail-assistant-network
