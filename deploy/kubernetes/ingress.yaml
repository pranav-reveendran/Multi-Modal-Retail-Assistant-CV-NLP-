apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: retail-assistant-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  labels:
    app: retail-assistant
spec:
  tls:
  - hosts:
    - retail-assistant.yourdomain.com
    secretName: retail-assistant-tls
  rules:
  - host: retail-assistant.yourdomain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: retail-assistant-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: retail-assistant-frontend
            port:
              number: 80
